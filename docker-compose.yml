# Brings up the whole PlayOnline-compatible core with one command:
#
#   docker compose up -d --build
#
# Before first start: copy .env.example to .env and set POL_ADVERTISE to the
# address your clients will reach this host on. Empty means 127.0.0.1
# (loopback-only testing).
#
# State lives in named volumes (pol-data, pol-certs). The two read-only
# mounts, www/ and mirrors/, hold content you supply yourself; see README.md
# ("bring your own client files").

# Exactly one service (dns) builds each image; every other service consumes
# it with pull_policy: never, so nothing tries to pull from a registry and
# parallel builds cannot race on the same tag.
x-app: &app
  image: openlobby:latest
  pull_policy: never
  restart: unless-stopped
  environment: &appenv
    POL_CONFIG: /config/server.yaml
    POL_ADVERTISE: "${POL_ADVERTISE:-}"
    # Per-network addresses (docs/configuration.md): what an internet client
    # and a LAN client are told to dial, when that differs from POL_ADVERTISE.
    POL_ADVERTISE_PUBLIC: "${POL_ADVERTISE_PUBLIC:-}"
    POL_ADVERTISE_LAN: "${POL_ADVERTISE_LAN:-}"
    POL_ADVERTISE_LAN_CLIENTS: "${POL_ADVERTISE_LAN_CLIENTS:-}"
    # Connection caps per process, login lockout, built-in portal pages and
    # log rotation (docs/configuration.md). Each default here is the code's.
    POL_MAX_CONNS: "${POL_MAX_CONNS:-256}"
    POL_MAX_CONNS_PER_IP: "${POL_MAX_CONNS_PER_IP:-32}"
    POL_LOGIN_LOCKOUT_FAILS: "${POL_LOGIN_LOCKOUT_FAILS:-5}"
    POL_LOGIN_LOCKOUT_WINDOW_S: "${POL_LOGIN_LOCKOUT_WINDOW_S:-900}"
    POL_TOKEN_ARM: "${POL_TOKEN_ARM:-1}"
    POL_PML_FALLBACK: "${POL_PML_FALLBACK:-1}"
    POL_GM_CALL: "${POL_GM_CALL:-0}"
    POL_LOG_MAX_MB: "${POL_LOG_MAX_MB:-8}"
    POL_LOG_KEEP: "${POL_LOG_KEEP:-3}"
    # PostgreSQL and Valkey, the two services below (docs/database.md).
    POL_DATABASE_URL: "postgresql://openlobby:${POL_DB_PASSWORD:-openlobby}@postgres:5432/openlobby"
    POL_VALKEY_URL: "valkey://valkey:6379/0"
  volumes:
    - ./config:/config:ro
    - pol-data:/data
    - pol-logs:/logs
  depends_on:
    postgres:
      condition: service_healthy
    valkey:
      condition: service_healthy

volumes:
  pol-data:
  pol-logs:
  pol-certs:
  pol-pgdata:
  pol-deployer:

# The network every OpenLobby install on this machine shares (docs/installs.md): the
# admin panel joins it, and a game installed with its own setup program joins it with its
# key as an alias, so the panel reaches it as http://<key>:<port>. It is external, so it
# must exist before `docker compose up`: setup.sh and setup.ps1 create it, and by hand it is
#
#   docker network inspect openlobby >/dev/null 2>&1 || docker network create openlobby
networks:
  openlobby:
    external: true
    name: openlobby

services:
  # The database. Accounts, friends, mail and saves live here; back up the
  # pol-pgdata volume (or run pg_dump) the way you back up pol-data. Not
  # published on the host; `docker compose exec postgres psql -U openlobby`
  # reaches it.
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    # Each process holds up to POL_DB_POOL connections (default 8). Ten
    # containers take 80 and each title plugin's containers add more, which
    # PostgreSQL's default of 100 cannot hold with tools and psql beside
    # them; see docs/database.md.
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_USER: openlobby
      POSTGRES_PASSWORD: "${POL_DB_PASSWORD:-openlobby}"
      POSTGRES_DB: openlobby
      # Byte-wise text order and ASCII-only lower(), what the account code
      # expects (docs/database.md). Read only when the volume is first created.
      POSTGRES_INITDB_ARGS: "--locale=C -E UTF8"
    volumes:
      - pol-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openlobby -d openlobby"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Live state only: who is online, sessions, live rooms, the push queue.
  # Nothing here needs to survive a restart, so it keeps nothing on disk.
  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  dns:
    <<: *app
    build: ./services
    pull_policy: build
    command: dns
    # Other installs on this machine find this resolver by the label and add their
    # names to it (docs/installs.md, "One DNS for every install").
    labels:
      org.openlobby.role: dns
    environment:
      <<: *appenv
      # Who may use this resolver (docs/configuration.md). Empty: loopback and
      # the private ranges. POL_DNS_PUBLIC=1 also answers internet clients, for
      # the redirected names only, and needs POL_ADVERTISE_PUBLIC.
      POL_DNS_CLIENTS: "${POL_DNS_CLIENTS:-}"
      POL_DNS_PUBLIC: "${POL_DNS_PUBLIC:-0}"
      POL_DNS_PUBLIC_RATE: "${POL_DNS_PUBLIC_RATE:-60}"
    ports:
      # POL_DNS_BIND lets hosts whose own resolver occupies the wildcard
      # bind (WSL, systemd-resolved on an interface) pin this to one address
      - "${POL_DNS_BIND:-0.0.0.0}:53:53/udp"
    healthcheck: &pyhc
      test: ["CMD", "python", "-c", "import socket;socket.socket().close()"]
      interval: 30s
      timeout: 5s
      retries: 3

  http:
    <<: *app
    command: http
    ports:
      - "80:80"
    volumes:
      - ./config:/config:ro
      - pol-data:/data
      - pol-logs:/logs
      - ${POL_WWW:-./www}:/www:ro
    # Port 80 for every install on this machine (docs/installs.md): a game's setup program
    # finds this service by its label and adds its host names (stub.py http-hosts); the
    # games' web servers are reached over the `openlobby` network.
    labels:
      org.openlobby.role: http
    networks:
      default: {}
      openlobby: {}
    healthcheck: *pyhc

  # SSL 3.0 terminators for the 2002-era client. Each container mints the
  # revival CA on first start (shared via the pol-certs volume), then runs
  # stunnel with the mounted config.
  ssl3web:
    build:
      context: ./services
      dockerfile: Dockerfile.ssl3
    image: openlobby-ssl3:latest
    restart: unless-stopped
    environment:
      # Each terminator issues its own leaf (same CA, shared via pol-certs):
      # a 2002-era stack that checks only the CN cannot be served two hosts
      # by one certificate.
      SSL3_CN: "wh000.pol.com"
      SSL3_CERT: "/certs/ssl3-web.pem"
    ports:
      - "443:443"
    volumes:
      - ./services/stunnel-web.conf:/etc/stunnel/stunnel.conf:ro
      - pol-certs:/certs
    depends_on:
      - http

  # The https the clients themselves start: the band (login relays a TLS hello
  # it sees on a lobby port here, POL_SSL3_HOST/PORT) and the sign-up wizard
  # (ucs relays its TLS half here, POL_UCS_SSL3_HOST/PORT). sslterm serves a
  # chain that ends in a root the unmodified Viewer already trusts, so players
  # install nothing (services/sslterm/main.go). To use stunnel and the revival
  # CA instead, set POL_SSL3_HOST=ssl3web and POL_UCS_SSL3_HOST=ssl3ucs.
  sslterm:
    build:
      context: ./services/sslterm
    image: openlobby-sslterm:latest
    restart: unless-stopped
    environment:
      SSLTERM_ROUTES: >-
        0.0.0.0:51443=userctl.pol.com>http:80
        0.0.0.0:8443=ucs.pol.com>ucs-plain:8080,md5
    depends_on:
      - http
      - ucs-plain

  ssl3ucs:
    image: openlobby-ssl3:latest
    pull_policy: never
    restart: unless-stopped
    environment:
      SSL3_CN: "ucs.pol.com"
      SSL3_CERT: "/certs/ssl3-ucs.pem"
    volumes:
      - ./services/stunnel-ucs.conf:/etc/stunnel/stunnel.conf:ro
      - pol-certs:/certs
    depends_on:
      - ucs-plain

  ucs:
    <<: *app
    entrypoint: ["python", "ucscgi.py"]
    environment:
      <<: *appenv
      # "1": the in-client wizard accepts any registration code and grants
      # every title the server offers (see .env.example)
      POL_SIGNUP_ANY_CODE: "${POL_SIGNUP_ANY_CODE:-}"
      # POL_SIGNUP_MODE=permissive makes the code optional; an empty code then
      # grants POL_SIGNUP_CONTENTS (default: every title offered). See .env.example.
      POL_SIGNUP_MODE: "${POL_SIGNUP_MODE:-}"
      POL_SIGNUP_CONTENTS: "${POL_SIGNUP_CONTENTS:-}"
      # Sign-up and registration-code limits (docs/configuration.md); empty
      # means the code's default.
      POL_SIGNUP_PER_DAY: "${POL_SIGNUP_PER_DAY:-}"
      POL_SIGNUP_PER_IP: "${POL_SIGNUP_PER_IP:-}"
      POL_REGCODE_LOCKOUT_FAILS: "${POL_REGCODE_LOCKOUT_FAILS:-}"
      POL_REGCODE_LOCKOUT_WINDOW_S: "${POL_REGCODE_LOCKOUT_WINDOW_S:-}"
      # The wizard's https goes to this terminator (see sslterm above).
      POL_UCS_SSL3_HOST: "${POL_UCS_SSL3_HOST:-sslterm}"
      POL_UCS_SSL3_PORT: "${POL_UCS_SSL3_PORT:-8443}"
    ports:
      - "51305:51305"
    volumes:
      - ./config:/config:ro
      - pol-data:/data
      - pol-logs:/logs
      # the wizard checks whether the registration art kit is present under
      # the portal tree (login serves it); without it, it draws art-free
      - ${POL_WWW:-./www}:/www:ro
    healthcheck: *pyhc

  login:
    <<: *app
    entrypoint: ["python", "responders.py"]
    command: directory,lobby,world,mail
    environment:
      <<: *appenv
      # The band's https goes to this terminator (see sslterm above).
      POL_SSL3_HOST: "${POL_SSL3_HOST:-sslterm}"
      POL_SSL3_PORT: "${POL_SSL3_PORT:-51443}"
      # Mail to and from the internet (services/extmail.py). Inert unless both
      # the SMTP relay and the domain are set, and then only for members
      # enabled on the admin panel. See .env.example.
      POL_EXT_MAIL_RELAY: "${POL_EXT_MAIL_RELAY:-}"
      POL_EXT_MAIL_DOMAIN: "${POL_EXT_MAIL_DOMAIN:-}"
      POL_EXT_MAIL_DAILY_OUT: "${POL_EXT_MAIL_DAILY_OUT:-}"
      POL_EXT_MAIL_DAILY_IN: "${POL_EXT_MAIL_DAILY_IN:-}"
      POL_EXT_MAIL_IN_PER_IP_HOUR: "${POL_EXT_MAIL_IN_PER_IP_HOUR:-}"
      # Lobby record layouts learned from Project Crystal Server. All off when
      # unset (an empty value reads as off); see responders.py at each knob.
      #   POL_PROFILE_TRAILER=1            0xB0 trailer on profile records
      #   POL_HANDLE_STORE_LAYOUT=crystal  read 0:8 as 64 records
      #   POL_HANDLE_STORE_DELETE=1        ...and act on its delete records
      #   POL_FRIEND_BITFIELD=head|1       friend row u64 bitfield (head first)
      POL_PROFILE_TRAILER: "${POL_PROFILE_TRAILER:-}"
      POL_HANDLE_STORE_LAYOUT: "${POL_HANDLE_STORE_LAYOUT:-}"
      POL_HANDLE_STORE_DELETE: "${POL_HANDLE_STORE_DELETE:-}"
      POL_FRIEND_BITFIELD: "${POL_FRIEND_BITFIELD:-}"
      # Hand back a friend request another device of the same account already
      # read, so the request is not stranded (off when unset; the TTL between
      # repeats defaults to 6 hours when empty).
      POL_FRIEND_REQUEST_HEAL: "${POL_FRIEND_REQUEST_HEAL:-}"
      POL_FRIEND_REQUEST_HEAL_TTL: "${POL_FRIEND_REQUEST_HEAL_TTL:-}"
    ports:
      # 51272 and 51305 are deliberately absent: 51272 belongs to a game
      # title's own service and 51305 to the ucs service.
      - "51200-51240:51200-51240"
      - "51251-51271:51251-51271"
      - "51273-51304:51273-51304"
      - "51306-51310:51306-51310"
      - "51330:51330"
      - "110:110"
      - "25:25"
    volumes:
      - ./config:/config:ro
      - pol-data:/data
      - pol-logs:/logs
      # the Viewer fetches portal pages through the lobby band, so the
      # portal tree must be visible here too (see the http service)
      - ${POL_WWW:-./www}:/www:ro
    healthcheck: *pyhc

  authsess:
    <<: *app
    entrypoint: ["python", "responders.py"]
    command: authserv
    environment:
      <<: *appenv
      # bind the auth band at relay-port + 200; authrelay dials it there
      POL_AUTH_LISTEN_OFFSET: "200"
      # Login-record 0x14/0x24/0x28 = the real mail/friend/handle list change
      # times instead of `now` on every login. Off when unset.
      POL_GATE_LIST_STAMPS: "${POL_GATE_LIST_STAMPS:-}"
      # Login crypto and sessions (learned from Project Crystal Server), all
      # off when unset:
      #   POL_AUTH_RSA=1 wraps a random session key to every client's RSA
      #   modulus; POL_AUTH_RSA_IPS=a.b.c.d,... does so for those clients only
      #   POL_AUTH_KILL_DUP=1 kicks an older login of the same client build
      #   signing in from another address (POL_AUTH_KILL_DUP_SCOPE=member for
      #   any other launch of the account)
      POL_AUTH_RSA: "${POL_AUTH_RSA:-}"
      POL_AUTH_RSA_IPS: "${POL_AUTH_RSA_IPS:-}"
      POL_AUTH_KILL_DUP: "${POL_AUTH_KILL_DUP:-}"
      POL_AUTH_KILL_DUP_SCOPE: "${POL_AUTH_KILL_DUP_SCOPE:-}"
      # "refuse": a login the account database cannot resolve is answered
      # "server busy" instead of continuing without an account.
      POL_ACCOUNTS_DB_FAIL: "${POL_ACCOUNTS_DB_FAIL:-}"
    healthcheck: *pyhc

  authrelay:
    <<: *app
    entrypoint: ["python", "authrelay.py"]
    environment:
      <<: *appenv
      # on this bridge network the auth responder is the authsess service
      # (host-networked deployments leave this at the 127.0.0.1 default)
      POL_RELAY_UPSTREAM: "authsess"
    ports:
      - "51241-51250:51241-51250"
    healthcheck: *pyhc

  # GM Call responder (the in-client "GM Call" band). Optional: it needs a
  # human GM watching the ticket directory, so it is off unless you start it
  # with `docker compose --profile gm up -d` and set POL_GM_CALL=1 so the
  # built-in menu shows the entry.
  gmd:
    <<: *app
    profiles: ["gm"]
    entrypoint: ["python", "gmd.py"]
    environment:
      <<: *appenv
      POL_GMD_PORT: "51112"
      POL_GMD_CHAT_IP: "${POL_ADVERTISE:-127.0.0.1}"
      POL_GMD_CHAT_PORT: "51112"
      POL_GMD_STATUS_FLAGS: "0x60"
      POL_GMD_CHAT_ROOM: "#gmchat001"
      POL_GMD_TICKET_DIR: "/data/gm-calls"
    ports:
      - "51112:51112/udp"
    healthcheck: *pyhc

  ucs-plain:
    <<: *app
    entrypoint: ["python", "ucscgi.py"]
    command: ["--plain", "--port", "8080"]
    environment:
      <<: *appenv
      POL_SIGNUP_ANY_CODE: "${POL_SIGNUP_ANY_CODE:-}"
      # POL_SIGNUP_MODE=permissive makes the code optional; an empty code then
      # grants POL_SIGNUP_CONTENTS (default: every title offered). See .env.example.
      POL_SIGNUP_MODE: "${POL_SIGNUP_MODE:-}"
      POL_SIGNUP_CONTENTS: "${POL_SIGNUP_CONTENTS:-}"
      POL_SIGNUP_PER_DAY: "${POL_SIGNUP_PER_DAY:-}"
      POL_SIGNUP_PER_IP: "${POL_SIGNUP_PER_IP:-}"
      POL_REGCODE_LOCKOUT_FAILS: "${POL_REGCODE_LOCKOUT_FAILS:-}"
      POL_REGCODE_LOCKOUT_WINDOW_S: "${POL_REGCODE_LOCKOUT_WINDOW_S:-}"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./config:/config:ro
      - pol-data:/data
      - pol-logs:/logs
      - ${POL_WWW:-./www}:/www:ro
    healthcheck: *pyhc

  admin:
    <<: *app
    entrypoint: ["python", "admin.py"]
    environment:
      <<: *appenv
      POL_EXT_MAIL_DOMAIN: "${POL_EXT_MAIL_DOMAIN:-}"
      # Break-glass login for the panel. The normal credential is set with
      # `admin.py --set-password` and kept in the database.
      POL_ADMIN_USER: "${POL_ADMIN_USER:-admin}"
      POL_ADMIN_PASSWORD: "${POL_ADMIN_PASSWORD:-}"
      # The deployer (docs/deployer.md), which runs the panel's game actions.
      # Without the deployer profile started, the panel says it is not there.
      POL_DEPLOYER_URL: "${POL_DEPLOYER_URL:-http://deployer:8099}"
      POL_DEPLOYER_TOKEN: "${POL_DEPLOYER_TOKEN:-}"
    ports:
      - "127.0.0.1:8090:8090"
    # The Overview's service checks dial the published ports on the host as
    # host.docker.internal (services/adminops.py). Docker Desktop defines that
    # name; on Linux it exists only through this entry.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # How other installs on this machine find the panel and reach their games' admin
    # ports (docs/installs.md): a game's setup program lists containers by these labels,
    # and each game joins the `openlobby` network with its key as an alias.
    labels:
      org.openlobby.role: panel
      org.openlobby.panel.url: "http://127.0.0.1:8090"
    networks:
      default: {}
      openlobby: {}
    healthcheck: *pyhc

  # The version-check server. The Viewer's FIRST connection is here (POL-1160
  # when it cannot answer). With no patch trees under mirrors/ it answers
  # "you are up to date" for the Viewer product in every region (POLP_CURRENT
  # below); drop your own patch trees into mirrors/ to serve real updates
  # (docs/patching.md builds one from an installed client).
  patch:
    <<: *app
    environment:
      <<: *appenv
      # POLP_CURRENT_ALL=1: every tree not under mirrors/ is answered as up to
      # date, so the Viewer and every title launch with no patch files at all.
      # Set it to 0 (and list trees in POLP_CURRENT) for strict behaviour.
      POLP_CURRENT_ALL: "${POLP_CURRENT_ALL:-1}"
      POLP_CURRENT: "${POLP_CURRENT:-}"
      # REGION/PROD[=BASE],...: leave files unchanged since the disc out of a
      # PS2 title's cmd-1 list (polserver2.py --slim-list). Empty = off.
      POLP_SLIM_LIST: "${POLP_SLIM_LIST:-}"
      # The Viewer version reported when its check arrives empty (a re-login),
      # and the newest row the console Viewer trees list. See .env.example.
      POLP_FALLBACK_VERSION: "${POLP_FALLBACK_VERSION:-}"
      POLP_CONSOLE_LIST_CAP: "${POLP_CONSOLE_LIST_CAP:-20130601_E}"
    entrypoint: ["sh", "-c", "exec python polserver2.py /mirrors --advertise \"${POL_ADVERTISE:-127.0.0.1}\""]
    ports:
      - "54000:54000"
      - "53001-53015:53001-53015"
    volumes:
      - ./config:/config:ro
      - pol-data:/data
      - pol-logs:/logs
      - ${POL_MIRRORS:-./mirrors}:/mirrors:ro
    healthcheck: *pyhc

  # Installs, enables, updates and restarts games for the admin panel by
  # running tools/stack.py (docs/deployer.md). Opt-in, never started by a
  # plain `up`:
  #
  #   docker compose --profile deployer up -d deployer
  #
  # It holds the Docker socket, which is root on this host. So it publishes
  # no port (only containers on this network reach it, as deployer:8099),
  # refuses to start without POL_DEPLOYER_TOKEN, and runs nothing but
  # stack.py with fixed arguments. POL_DEPLOY_ROOT, the directory holding
  # this checkout and the game checkouts, is mounted at the same path inside
  # so the paths in the game compose files mean the same to the daemon (on
  # Docker Desktop for Windows it is the path the daemon's VM sees,
  # /run/desktop/mnt/host/c/... for C:\..., and the deployer checks at start
  # that the daemon sees the folder there); the
  # bind is never created when the directory is missing or the variable is
  # unset. Commands it runs leave this profile out, so it never recreates
  # itself. POL_DEPLOY_CLIENTS, a folder of client installs the panel may
  # browse for the import action, is mounted read-only at the same path
  # (never created when missing). Unset, the deployer's own source folder
  # stands in at a placeholder path so the container still starts, and
  # browsing is off. Uploaded archives are kept in the pol-deployer volume,
  # up to POL_DEPLOY_UPLOAD_MAX unpacked. The patch actions write bundles
  # into the folder the patch service serves: the bind below names it with
  # the same ${POL_MIRRORS:-./mirrors} as that service, so both always mean
  # one host folder, and it is created when missing just as the patch
  # service's own mount creates it.
  deployer:
    profiles: ["deployer"]
    build: ./services/deployer
    image: openlobby-deployer:latest
    pull_policy: build
    restart: unless-stopped
    environment:
      POL_DEPLOYER_TOKEN: "${POL_DEPLOYER_TOKEN:-}"
      POL_DEPLOYER_BIND: "${POL_DEPLOYER_BIND:-0.0.0.0:8099}"
      POL_DEPLOY_ROOT: "${POL_DEPLOY_ROOT:-}"
      POL_DEPLOY_CORE: "${POL_DEPLOY_CORE:-}"
      POL_DEPLOY_GHCR: "${POL_DEPLOY_GHCR:-}"
      POL_DEPLOY_CLIENTS: "${POL_DEPLOY_CLIENTS:-}"
      POL_DEPLOY_UPLOAD_MAX: "${POL_DEPLOY_UPLOAD_MAX:-8G}"
      # the dev update channel (docs/deployer.md, "Dev channel"); the access code is not here
      POL_DEV_REGISTRY: "${POL_DEV_REGISTRY:-}"
      POL_DEV_SOURCE: "${POL_DEV_SOURCE:-}"
      POL_DEV_USER: "${POL_DEV_USER:-}"
      POL_DEPLOY_MIRRORS: /mirrors
      # patch actions wait for downloads in progress before restarting patch
      POL_VALKEY_URL: "valkey://valkey:6379/0"
      POL_DEPLOY_PATCH_DRAIN: "${POL_DEPLOY_PATCH_DRAIN:-1800}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - type: bind
        source: "${POL_DEPLOY_ROOT:-/POL_DEPLOY_ROOT-is-not-set}"
        target: "${POL_DEPLOY_ROOT:-/POL_DEPLOY_ROOT-is-not-set}"
        bind:
          create_host_path: false
      - type: bind
        source: "${POL_DEPLOY_CLIENTS:-./services/deployer}"
        target: "${POL_DEPLOY_CLIENTS:-/POL_DEPLOY_CLIENTS-is-not-set}"
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${POL_MIRRORS:-./mirrors}"
        target: /mirrors
        bind:
          create_host_path: true
      - pol-deployer:/deployer
    healthcheck:
      test: ["CMD", "python", "/app/deployer.py", "--healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
