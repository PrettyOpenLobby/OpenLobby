; stunnel: terminate the PORTAL's HTTPS (443) for BOTH clients, forward plaintext.
;
; Why this exists, and why the Python listener could not do the job:
;
; The Content-ID acquisition servlet lives at
;   https://userctl.pol.com/pml-cgi-bin/UMENZ001.cgi
; -- an HTTPS endpoint. Our own 443 listener (stub.py) negotiates TLSv1.3 with
; TLS_AES_256_GCM_SHA384, because that is what a current Python/OpenSSL offers.
; The PS2 Viewer's ClientHello is genuine SSL 3.0 offering RSA key exchange with
; RC4/3DES/DES and two export suites (see Dockerfile.ssl3 for the exact list), so
; the two have NOTHING in common: the servlet could be implemented perfectly and
; the PS2 would still never reach it. Python cannot be made to speak SSLv3 --
; every current distro builds OpenSSL with no-ssl3, which is the whole reason
; Dockerfile.ssl3 compiles 1.1.1w from source with it put back.
;
; DIFFERENT FROM stunnel-ssl3.conf: that one pins SSLv3 ONLY, because its peer
; (the ucs sign-up flow on 51305) is the PS2 and nothing else. Port 443 serves
; the PC Viewer too, so this one takes a RANGE -- SSLv3 through TLSv1.2 -- and a
; cipher list with both eras in it. Pinning SSLv3 here would lock the PC client
; out of the portal to fix the PS2, which is a trade nobody asked for.
;
; ---------------------------------------------------------------------------
; DELIBERATELY BROKEN CRYPTO, same caveat as Dockerfile.ssl3: SSL 3.0 with
; RC4/export ciphers is dead (POODLE, BEAST, RC4 biases). Acceptable here and
; only here -- the peers are 2003/2011 game clients on a private network. Do NOT
; expose this to the internet.
; ---------------------------------------------------------------------------

foreground = yes

; stunnel uses SYSLOG levels, so 4 is WARNING and logs nothing per connection --
; which is the trap the ucs terminator's config is still in. 6 = info, which logs
; each accepted connection with its negotiated protocol and cipher, and logs a
; refused handshake with the reason.
;
; This is the SECOND half of why this service exists: stunnel
; logs the negotiated protocol and cipher per connection, and logs a failed
; handshake with the reason. Until now a PS2 that could not handshake left
; NOTHING anywhere -- stub.py's own "TLS handshake FAILED" line only fires for
; an ssl.SSLError it actually gets to see. `docker compose logs ssl3web` is now
; the place to look when the client "does nothing".
; 7 (LOG_DEBUG) while the PS2's DNAS client is being worked out: 6 reports a
; refused handshake only as `SSL_accept: Success (0)`, an empty error queue,
; which does not say WHY. 7 logs each handshake state transition and, crucially,
; any TLS alert the peer sends -- `bad certificate` (42) / `unknown CA` (48) is
; the difference between "it hates our chain" (patch the console's trust store)
; and something else entirely. Put this back to 6 when that is settled; it is
; noisy per connection.
debug = 7
output = /dev/stdout

pid =

; The one the PS2 actually uses. The Viewer does HTTPS over the SAME 5130x band
; as its plain PML fetches and never touches :443, so its ClientHello lands on a
; lobby port; responders._relay_tls sniffs the `16 03` record header there and
; pumps the connection here. Not published to the host -- only the `login`
; container connects to it, by service name.
[band]
accept  = 0.0.0.0:51443
connect = http:80

; Repeated per service on purpose: stunnel does NOT inherit these across
; sections, and a [band] without them fails the whole config with
; "TLS server needs a certificate" -- taking the working [web] down with it.
cert = /certs/ssl3.pem
sslVersionMin = SSLv3
sslVersionMax = TLSv1.2
options = -NO_SSLv3
ciphers = HIGH:MEDIUM:DES-CBC3-SHA:RC4-SHA:RC4-MD5:DES-CBC-SHA:EXP-RC4-MD5:EXP-DES-CBC-SHA:@SECLEVEL=0
renegotiation = no

[web]
accept  = 0.0.0.0:443
; The plain-HTTP portal handler. Same content, same Host-header routing out of
; www/ -- it just never sees TLS.
connect = http:80

; Port 443 here is dialled by exactly one thing: the PS2's DNAS client, asking
; for gate1.jp.dnas.playstation.org.  It gets its OWN certificate because the
; portal's `*.pol.com` leaf carries that hostname only in a SubjectAltName --
; an X.509 v3 extension -- while every root this client ships is v1 with no
; extensions.  A stack that only reads CN sees `*.pol.com` against
; `gate1.jp.dnas.playstation.org` and rejects, which looks exactly like a
; trust failure: our Certificate is read and the socket is reset with no alert.
; So dnas.pem is a v1 leaf whose CN *is* the hostname.  The band ports keep
; ssl3.pem, which is what the Viewer's portal fetches expect.
cert = /certs/dnas.pem

; SSLv3 (PS2) through TLSv1.2 (PC). TLS 1.3 is deliberately out: its ciphersuites
; are configured separately and no client we serve asks for it.
sslVersionMin = SSLv3
sslVersionMax = TLSv1.2
; stunnel 5.x sets NO_SSLv3 by default; clearing the version range alone is not
; enough, the option has to be cleared explicitly.
options = -NO_SSLv3

; Both eras in one list, strongest first, so a modern client still gets a modern
; suite and the PS2 falls through to 3DES/RC4/export.
; @SECLEVEL=0 is REQUIRED, not decorative: OpenSSL 1.1.x refuses SSLv3 and every
; legacy cipher at the default security level, and the failure is opaque
; ("tls_setup_handshake: internal error", no mention of security levels).
ciphers = HIGH:MEDIUM:DES-CBC3-SHA:RC4-SHA:RC4-MD5:DES-CBC-SHA:EXP-RC4-MD5:EXP-DES-CBC-SHA:@SECLEVEL=0

; A 2003 client will not send SNI and will not renegotiate properly.
renegotiation = no
