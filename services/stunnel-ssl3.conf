; stunnel: terminate SSL 3.0 from the PlayOnline Viewer, forward plaintext.
;
; The service behind this runs with --plain and never sees TLS. See
; Dockerfile.ssl3 for why this protocol is pinned to something long dead.

foreground = yes
debug = 4
output = /dev/stdout

; No privilege drop: the container is already unprivileged and there is no
; chroot to set up.
pid =

[ucs]
accept  = 0.0.0.0:51305
connect = 127.0.0.1:8080

cert = /certs/ssl3.pem

; SSLv3 only. stunnel 5.x disables it by default via the NO_SSLv3 option, so it
; has to be cleared explicitly -- setting the version range alone is not enough.
sslVersionMin = SSLv3
sslVersionMax = SSLv3
options = -NO_SSLv3

; Exactly the suites the Viewer offers, RSA key exchange only. Export ciphers
; are included because the client lists them; strongest-first ordering means
; 3DES wins when the client will take it.
; @SECLEVEL=0 is REQUIRED, not decorative. OpenSSL 1.1.x refuses SSLv3 and every
; cipher here at the default security level, and the failure is opaque:
; "tls_setup_handshake: internal error" with no mention of security levels.
; Without it the whole terminator is dead on arrival.
ciphers = DES-CBC3-SHA:RC4-SHA:RC4-MD5:DES-CBC-SHA:EXP-RC4-MD5:EXP-DES-CBC-SHA:@SECLEVEL=0

; A 2003 client will not send SNI and will not do renegotiation properly.
renegotiation = no
