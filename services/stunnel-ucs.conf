; stunnel: terminate the SIGN-UP wizard's TLS, forward plaintext to ucscgi.
;
; This is the piece that was missing. `ucs` terminated TLS itself in Python,
; whose OpenSSL is built `no-ssl3`, so the Viewer's genuine SSL 3.0 ClientHello
; was refused every time:
;
;   TLS handshake FAILED (client hello 160300): [SSL: VERSION_TOO_LOW]
;
; -- surfacing client-side as POL-1322 ("An error occurred in SSL
; communication"). No amount of configuration fixes that: the protocol is absent
; from the library. Dockerfile.ssl3 compiles OpenSSL 1.1.1w with SSLv3 put back
; and links stunnel against it; this config points that build at the sign-up CGI.
;
; TOPOLOGY, and why stunnel does not simply own 51305:
;
;   client --TLS--> ucs:51305 (sniffs first byte) --raw--> ssl3ucs:8443
;                                                             |
;                                                     decrypts, plain HTTP
;                                                             v
;                                                       ucs-plain:8080
;
; 51305 carries plaintext PORTAL traffic as well as the wizard's TLS, and
; ucscgi.py splits the two on the first byte (0x16 0x03 = ours, anything else is
; relayed to the portal handler byte-for-byte). stunnel cannot do that sniff, so
; giving it the port outright would break portal browsing. It stays behind the
; sniffer and only ever sees connections already known to be TLS.
;
; ---------------------------------------------------------------------------
; DELIBERATELY BROKEN CRYPTO, same caveat as Dockerfile.ssl3: SSL 3.0 with
; RC4/export ciphers is dead (POODLE, BEAST, RC4 biases). Acceptable here and
; only here -- the peer is a 2003 game client on a private network and the
; content is a hobby server's sign-up form. Do NOT expose this to the internet.
; ---------------------------------------------------------------------------

foreground = yes

; SYSLOG levels: 4 is WARNING and logs NOTHING per connection, which is the trap
; the older stunnel-ssl3.conf sat in -- a client that failed to handshake left no
; trace anywhere. 6 = info logs each connection with its negotiated protocol and
; cipher, and logs a refusal with the reason. `docker compose logs ssl3ucs` is
; the place to look when the wizard "does nothing".
debug = 6
output = /dev/stdout

; No privilege drop: the container is already unprivileged and there is no
; chroot to set up.
pid =

[ucs]
accept  = 0.0.0.0:8443
connect = ucs-plain:8080

cert = /certs/ssl3.pem

; A RANGE, not an SSLv3 pin. The measured hello from this client is SSL 3.0
; (record 16 03 00), but the PC Viewer is not the only thing that may arrive
; here and pinning costs nothing to avoid -- stunnel-web.conf takes the same
; range for the same reason. stunnel 5.x sets NO_SSLv3 by default, so clearing
; the version floor alone is not enough; the option must be cleared explicitly.
sslVersionMin = SSLv3
sslVersionMax = TLSv1.2
options = -NO_SSLv3

; Both eras, strongest first, so the 2003 client falls through to 3DES/RC4/export
; while anything newer still gets a real suite.
; @SECLEVEL=0 is REQUIRED, not decorative: OpenSSL 1.1.x refuses SSLv3 and every
; cipher here at the default security level, and the failure is opaque --
; "tls_setup_handshake: internal error", with no mention of security levels.
ciphers = HIGH:MEDIUM:DES-CBC3-SHA:RC4-SHA:RC4-MD5:DES-CBC-SHA:EXP-RC4-MD5:EXP-DES-CBC-SHA:@SECLEVEL=0

; A 2003 client will not send SNI and will not renegotiate properly.
renegotiation = no
